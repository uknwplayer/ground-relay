name: Apply M8 final runtime cleanup

on:
  push:
    branches: ["m8-product-hardening"]
    paths:
      - ".github/workflows/m8-final-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8-product-hardening

      - name: Remove historical runtime fixture and terminalize hosted seed
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          source_path = Path('src/solana/ground-relay.ts')
          source = source_path.read_text()
          legacy_block = '''export const GROUND_RELAY_TASK_ADDRESS = address(
            "7knPNeaZHDn7qVzdGy6Qbq3tWnHMnP2TpHULwLKzVtpT",
          );

          export const GROUND_RELAY_VAULT_ADDRESS = address(
            "FGaGmGu8cbYRbdsUubmLDDRNnjic5NutnCM4kFL77bZm",
          );

          export const GROUND_RELAY_REWARD_MINT = address(
            "So11111111111111111111111111111111111111112",
          );

          export const GROUND_RELAY_WORKER_TOKEN_ADDRESS = address(
            "2fm8p8DpCeJvcpvNbCpzURRezQthF2z2yQARLgPgZfu6",
          );

          '''
          if legacy_block not in source:
              raise SystemExit('legacy address block not found')
          source = source.replace(legacy_block, '', 1)
          poster_block = '''export const GROUND_RELAY_POSTER_ADDRESS = address(
            "6WG3UpKV9vBRh4XR961eZGpPZcHVGdxqpM3Eten5quuZ",
          );

          export const GROUND_RELAY_FIXTURE_TASK_ID =
            "e335a4ea1f23a002db02f94c371d311b5b46fa908a7f2f6c9f72e60ea122f662";

          '''
          if poster_block not in source:
              raise SystemExit('legacy poster/task-id block not found')
          source_path.write_text(source.replace(poster_block, '', 1))

          test_path = Path('test/selected-task-solana.test.mjs')
          test = test_path.read_text()
          test = test.replace('  GROUND_RELAY_TASK_ADDRESS,\n', '')
          test = test.replace(
              'const taskA = GROUND_RELAY_TASK_ADDRESS.toString();',
              'const taskA = "7knPNeaZHDn7qVzdGy6Qbq3tWnHMnP2TpHULwLKzVtpT";',
          )
          test_path.write_text(test)

          demo = Path('src/demo/task.ts')
          if not demo.exists():
              raise SystemExit('legacy demo task already missing unexpectedly')
          demo.unlink()

          state_path = Path('gateway/data/state.json')
          state = json.loads(state_path.read_text())
          task = state['tasks']['m8-physical-2026-09-27-v1']
          task['status'] = 'paid'
          task['worker'] = '7XY6t1adc9vmuefiEP25TsoEjxRkFhVxT4yQrtN5zr2C'
          task['evidenceHash'] = '87c1f0a74d733d3f7e197dc8eb2319bbcd1e55eadef00a4db7c84e64124aeed1'
          task['chain']['lastSyncedAt'] = '2026-09-27T10:13:45.000Z'
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          PY
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/solana/ground-relay.ts test/selected-task-solana.test.mjs gateway/data/state.json
          git rm src/demo/task.ts
          git commit -m "chore: retire historical runtime fixture state"
          git push origin HEAD:m8-product-hardening
