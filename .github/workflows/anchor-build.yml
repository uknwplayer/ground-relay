name: Anchor SBF + IDL

on:
  push:
    branches: ["main"]
    paths:
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "programs/**"
      - ".github/workflows/anchor-build.yml"
  pull_request:
    paths:
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "programs/**"
      - ".github/workflows/anchor-build.yml"
  workflow_dispatch:

concurrency:
  group: anchor-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana CLI 4.1.2
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install AVM and Anchor 1.2.0
        run: |
          cargo install --git https://github.com/otter-sec/anchor avm --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          avm install 1.2.0
          avm use 1.2.0
      - name: Install SBF platform tools v1.57
        run: cargo build-sbf --tools-version v1.57 --install-only
      - name: Toolchain versions
        run: |
          anchor --version
          solana --version
          rustc --version
      - name: Build SBF and IDL
        run: anchor build
      - name: Verify build artifacts
        run: |
          test -f target/deploy/ground_relay.so
          test -f target/idl/ground_relay.json
          ls -lh target/deploy/ground_relay.so target/idl/ground_relay.json
      - name: Upload public build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ground-relay-anchor-build
          path: |
            target/deploy/ground_relay.so
            target/idl/ground_relay.json
          if-no-files-found: error
