name: Apply M8 authoritative display fix

on:
  push:
    branches: ["m8-product-hardening"]
    paths:
      - ".github/workflows/m8-apply-authoritative-display-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8-product-hardening
      - name: Replace stale Gateway fallback in selected-task detail
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("App.tsx")
          source = path.read_text()
          old = "  const displayStatus = authoritative?.status ?? selectedTask?.status;\n  const displayWorker = authoritative?.worker ?? selectedTask?.worker;"
          new = "  const displayStatus = authoritative?.status;\n  const displayWorker = authoritative?.worker;"
          if old not in source:
              raise SystemExit("expected stale status fallback was not found")
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit minimal fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "fix: keep selected task status authoritative"
          git push origin HEAD:m8-product-hardening
