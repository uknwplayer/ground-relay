name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "App.tsx"
      - "app.json"
      - "index.js"
      - "polyfill.js"
      - "package.json"
      - "tsconfig.json"
      - "src/**"
      - "test/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "App.tsx"
      - "app.json"
      - "index.js"
      - "polyfill.js"
      - "package.json"
      - "tsconfig.json"
      - "src/**"
      - "test/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
