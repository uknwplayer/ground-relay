name: Inspect deployed program metadata

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/inspect-devnet-program.py"
      - ".github/workflows/program-metadata.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect upgradeable-loader metadata
        run: python3 scripts/inspect-devnet-program.py
