name: Devnet program preflight

on:
  push:
    branches: ["main"]
    paths:
      - "Anchor.toml"
      - "programs/ground-relay/src/lib.rs"
      - "scripts/verify-devnet-program.sh"
      - ".github/workflows/devnet-preflight.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify declared program account through signer-free Solana RPC
        run: bash scripts/verify-devnet-program.sh
