name: Gateway check

on:
  push:
    branches: ["main", "m7-agent-gateway-resume"]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-check.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-check.yml"

permissions:
  contents: write

concurrency:
  group: gateway-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and generate dependency lock
        run: npm install
        working-directory: gateway
      - run: npm test
        working-directory: gateway
      - name: Commit generated lockfile on feature branch
        if: github.ref_name == 'm7-agent-gateway-resume'
        run: |
          if git diff --quiet -- gateway/package-lock.json && git ls-files --error-unmatch gateway/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/package-lock.json
          git commit -m "chore: lock gateway solana dependency"
          git push
