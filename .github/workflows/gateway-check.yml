name: Gateway check

on:
  push:
    branches: ["main", "m7-agent-gateway-resume"]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-check.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-check.yml"

concurrency:
  group: gateway-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate dependency lock for M7 branch
        run: npm install
        working-directory: gateway
      - name: Print generated lockfile
        run: cat package-lock.json
        working-directory: gateway
      - run: npm test
        working-directory: gateway
