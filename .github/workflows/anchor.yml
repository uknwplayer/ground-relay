name: Anchor program CI

on:
  push:
    branches: ["main"]
    paths:
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "programs/**"
      - ".github/workflows/anchor.yml"
  pull_request:
    paths:
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "programs/**"
      - ".github/workflows/anchor.yml"
  workflow_dispatch:

concurrency:
  group: anchor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
          build-warnings: ""
      - name: Check Ground Relay program
        env:
          RUSTFLAGS: --allow unexpected_cfgs
        run: cargo check --manifest-path programs/ground-relay/Cargo.toml
      - name: Test Ground Relay program
        env:
          RUSTFLAGS: --allow unexpected_cfgs
        run: cargo test --manifest-path programs/ground-relay/Cargo.toml
