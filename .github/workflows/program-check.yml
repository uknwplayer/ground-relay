name: Program check

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Anchor.toml"
      - "programs/**"
      - ".github/workflows/program-check.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Anchor.toml"
      - "programs/**"
      - ".github/workflows/program-check.yml"

concurrency:
  group: program-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo check --manifest-path programs/ground-relay/Cargo.toml
